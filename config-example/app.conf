# This is the main application config of ThePhish-NG. You can find more detailed documentation on github in /docs/configuration.md.
version = 1

[webapp]
# URL used to access thephish (included in result email)
base_url = "https://thephish.example.com"
# Show the application version in the footer and health endpoint
show_version = true
# target URLs for the navbar links
thehive_url = "https://link-to-thehive/"
cortex_url = "https://link-to-cortex/"
misp_url = "https://link-to-misp/"

[redis]
# Application data (logical database 0).
url = "redis://redis:6379/0"
key_prefix = "thephish"
celery_broker_url = "redis://redis:6379/1"
celery_result_backend_url = "redis://redis:6379/2"

[analysis]
# after how many days should thephish drop finished analyses? (cases will stay available in thehive)
retention_days = 7
# Decode outlook safelinks and add the found url as observable
decode_o365_safelinks = true
# Follow HTTP redirects of found urls and add all urls in the redirect trace as observables
follow_url_redirects = true
# List of analyzer name prefixes that will never be run
analyzer_prefix_blacklist = ["UnshortenLink", "MSDefenderOffice365_SafeLinksDecoder_json"]
# Number of malicious observables required for a malicious verdict
malicious_observable_threshold = 1

[imap]
# imap configuration for accessing mail inbox
host = "imap.gmail.com"
port = 993
# must be 'tls', 'starttls' or 'none'
tls_mode = "tls"
# enable certificate validation
tls_verify = true
user = "example@gmail.com"
password = "passwort.213"
folder = "inbox"
# max message size in Mebibyte
max_message_size_mb = 25
# how much emails to list when retrieving emails
email_list_amount = 20

[thehive]
# thehive api settings
url = "https://thehive.example.com"
apikey = "generated_api_key"
# enable certificate validation
tls_verify = true
# Cortex server identifier configured in thehive
cortex_id = "cortex"
# MISP server identifier configured in TheHive
misp_id = "MISP"

[case]
# TheHive case settings
tlp = 2
pap = 2
tags = ["email", "ThePhish"]
# Add the ThePhish-NG analysis link to the case
add_analysis_link = true
# Export malicious cases to MISP
export_malicious_to_misp = true
# Automatically close cases after analysis is complete
# Close malicious verdict as TruePositive
auto_close_malicious = true
# Close safe verdict as FalsePositive
auto_close_safe = true
# Close suspicious verdict as Indeterminate
auto_close_suspicious = false

[notifications]
# Send email at the start of an analysis
send_start = true
# Send email at the end of an analysis with malicious verdict
send_result_malicious = true
# Send email at the end of an analysis with safe verdict
send_result_safe = true
# Send email at the end of an analysis with suspicious verdict
send_result_suspicious = false

# Include a link to the ThePhish-NG analysis in the email
include_analysis_link = true
# Include the analysis log in the result email
include_log = true
# Include the verdict in the email; disabling this also disables the analyzer summary and analysis log
include_verdict = true

# all notifications will be sent to this email, if empty, the emails will be sent to the address that submitted the email
recipient_override = ""
