# ThePhish-NG deployment stack.
#
# Before the first start, adjust these values in config/app.conf:
#
#   [redis]  url                       = "redis://redis:6379/0"
#            celery_broker_url         = "redis://redis:6379/1"
#            celery_result_backend_url = "redis://redis:6379/2"

name: thephish-ng

services:
  thephish-ng:
    image: ghcr.io/dead-plant/thephish-ng:1
    command: ["--bind-addr", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    init: true
    volumes:
      - ./config:/thephish/config:ro,z
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp:mode=1777,size=512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", 'import json, sys, urllib.request; r = urllib.request.urlopen("http://127.0.0.1:8080/api/health", timeout=3); sys.exit(0 if r.status == 200 and json.load(r).get("status") == "ok" else 1)']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "900 1"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
